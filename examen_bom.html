<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Examen BOM</title>
    <script src="script.js" defer></script>
</head>
<body>
    <h1>INFO: (ACT1)</h1>
        <ul>URL de la página: <span id="url"></span></ul>
        <ul>El nombre del navegador o agente: <span id="navegador"></span></ul>
        <ul>Ancho y alto disponible: <span id="pantalla"></span></ul>
        <ul>Idioma del navegador: <span id="idioma"></span></ul>

    <hr>
    <br>

    <h1>Boton: (ACT2)</h1>
        <button onclick="mostrarDimensiones()">Mostrar dimensiones</button>

    <hr>
    <br>

    <h1>Botones: (ACT3)</h1>
        <button onclick="recargar()">Recargar</button>
        <button onclick="volver()">Volver</button>


    <hr>
    <br>

    <h1>Timer: (ACT4)</h1>
        <p>Segundos: <span id="contador"></span></p>
        <button onclick="iniciar()">Iniciar</button>
        <button onclick="detener()">Dentener</button>
    <hr>
    <br>

    <h1> Ventanas: (ACT5)</h1>
        <button onclick="abrir()">Abrir ventana</button>
        <button onclick="cerrar()">Cerrar ventana</button>

    <hr>
    <br>

    <h1> Fondo: (ACT6)</h1>
        <button onclick="fondo()">Cambiar fondo</button>

    <hr>
    <br>


    <h1> Cuadros de diálogo: (ACT7)</h1>
        <button onclick="saludar()">Mostrar información</button>

    <hr>
    <br>

    <h1> Tamaño ventana: (ACT8)</h1>
        <button onclick="comprobar()">Comprobar tamaño</button>

    </body>
</html>
